name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        cache-dependency-path: |
          android/**/*.gradle*
          android/gradle/libs.versions.toml
          android/gradle/wrapper/gradle-wrapper.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode google-services.json (if configured)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
          case "$trimmed" in
            \{*) printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
            *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json ;;
          esac
        fi

    - name: Build Debug APK
      env:
        TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY || secrets.MAPS_API_KEY || 'fxxBdOwiITup2btha0dFUl6IOxczJm4f' }}
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
